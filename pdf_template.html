<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: "Meiryo", sans-serif; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
    </style>
    <title>単語テスト PDF</title>
</head>
<body>
    <h1>単語テスト</h1>
    <table>
        <tr>
            <th>番号</th>
            <th>単語</th>
            <th>（解答欄）</th>
            <th>意味（答え）</th>
        </tr>
        {% for i, word in enumerate(words, 1) %}
        <tr>
            <td>{{ i }}</td>
            <td>{{ word.単語 }}</td>
            <td>＿＿＿＿＿＿＿＿＿＿＿＿＿＿</td>
            <td>{{ word.意味 }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
